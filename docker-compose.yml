version: "3.8"
services:
  frontend:
    build:
      context: ../War_House_Front 
      args:
        - ENV=${ENV}
    ports:
      - "5173:5173" 
    environment:
      - VITE_API_URL=http://localhost:4000 
    
    container_name: war_house_frontend
    

  backend:
    build:
      context: . 
      args : 
        - ENV=${ENV}
        - PORT_APP=${PORT_APP}
        - MONGO_URL=${MONGO_URL}
    ports:
      - "4000:4000"
    environment:
      - MONGO_URL=${MONGO_URL}
      - PORT_APP=${PORT_APP}
      - ENV=${ENV}
    depends_on:
      - mongo
    volumes:
      - .:/war_house_back 
    container_name: war_house_backend
    

  mongo:
    image: mongo:latest 
    ports:
      - "27017:27017" 
    volumes:
      - mybd:/data/db
    container_name: war_house_db
   

volumes:
  mybd:
