version: "3.8"
services:
  frontend:
    build:
      context: ../War_House_Front 
    ports:
      - "5173:5173" 
    environment:
      - VITE_API_URL=http://localhost:4000 
    volumes:
      - ../War_House_Front:/war_house_front
      - /war_house_front/node_modules
    container_name: war_house_frontend
    deploy:
      resources:
        limits:
          cpus: "0.5"       # Limite le CPU à 50% d'un cœur
          memory: "300M"    # Limite la mémoire à 300MB

  backend:
    build:
      context: . 
    ports:
      - "4000:4000"
    environment:
      - MONGO_URL=mongodb://mongo:27017 
    depends_on:
      - mongo
    volumes:
      - .:/war_house_back 
    container_name: war_house_backend
    deploy:
      resources:
        limits:
          cpus: "0.7"       # Limite le CPU à 70% d'un cœur
          memory: "400M"    # Limite la mémoire à 400MB

  mongo:
    image: mongo:latest 
    ports:
      - "27017:27017" 
    volumes:
      - mybd:/data/db
    container_name: war_house_db
    deploy:
      resources:
        limits:
          cpus: "0.3"       # Mongo ne doit pas prendre tout le CPU
          memory: "250M"    # Limite MongoDB à 250MB de RAM

volumes:
  mybd:
