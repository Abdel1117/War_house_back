version: "3.8"
services:
  frontend:
    build:
      context: ../War_House_Front 
      args:
        - ENV=${ENV}
    ports:
      - "5173:5173" 
    environment:
      - FRONT_APP_URL=${FRONT_APP_URL} 
    volumes:
      - ../War_House_Front:/war_house_front
      - /war_house_front/node_modules
    container_name: war_house_frontend
    

  backend:
    build:
      context: . 
    ports:
      - "4000:4000"
    environment:
      - MONGO_URL=${MONGO_URL}
    depends_on:
      - mongo
    volumes:
      - .:/war_house_back 
    container_name: war_house_backend
    

  mongo:
    image: mongo:latest 
    ports:
      - "27017:27017" 
    volumes:
      - mybd:/data/db
    container_name: war_house_db
   

volumes:
  mybd:
    labels: 
      keep: "true"

