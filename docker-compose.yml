version: "3.8"
services:
  frontend:
    build:
      context: ../War_House_Front
      args:
        - ENV=${ENV}
    ports:
      - "5173:5173"
    environment:
      - FRONT_APP_URL=${FRONT_APP_URL}
    container_name: war_house_frontend

  backend:
    build:
      context: .
      args :
        - ENV=${ENV}
        - PORT_APP=${PORT_APP}
        - MONGO_URL=${MONGO_URL}
        - DB_USER=${DB_USER}
        - DB_PASS=${DB_PASS}
        - DB_PORT=${DB_PORT}
    ports:
      - "${PORT_APP}:${PORT_APP}"
    environment:
      - MONGO_URL=${MONGO_URL}
      - PORT_APP=${PORT_APP}
      - ENV=${ENV}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_PORT=${DB_PORT}
      - FRONT_APP_URL=${FRONT_APP_URL}

    depends_on:
      - mongo
    container_name: war_house_backend


  mongo:
    image: mongo:latest
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - mybd:/data/db
    container_name: war_house_db

volumes:
  mybd: